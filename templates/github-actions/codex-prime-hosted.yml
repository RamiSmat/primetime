name: PrimeTime Codex primer (hosted)

# This is the OIDC/GitHub-App variant of codex-prime.yml: it trusts a
# hosted PrimeTime backend to mint the token that writes the refreshed
# Codex session back to this repo's secret, instead of a hand-created
# PRIMETIME_SECRETS_PAT. It never trusts that backend with the Codex
# session itself — CODEX_AUTH_JSON still moves directly between this runner
# and this repository's own secrets, exactly as in codex-prime.yml.
#
# The PrimeTime dashboard's "Create my warmup repository" flow adds this
# file for you (with PRIMETIME_WEB_URL/OIDC_AUDIENCE already filled in) via
# scripts/setup-warmup-repo.sh — that's the recommended path. To do it by
# hand instead:
#
#   1. Install the PrimeTime GitHub App on this repository (with access to
#      "All repositories").
#   2. `codex login` locally (ChatGPT, an access token, or workload
#      identity — never an API key), then from a local checkout of the
#      PrimeTime repository run `GH_REPO=<owner>/<repo> node
#      apps/cli/dist/src/bin.js setup codex` to transfer that session to
#      this repo's CODEX_AUTH_JSON secret.
#   3. Copy this file into .github/workflows/ in that repository, and
#      replace PRIMETIME_WEB_URL and OIDC_AUDIENCE below with your actual
#      deployed PrimeTime backend's URL.
#
# If you'd rather not have a hosted backend in your trust chain at all, use
# codex-prime.yml instead — it needs no GitHub App and no external backend,
# only the PrimeTime CLI and `gh`.
#
# PrimeTime is not yet published as an installable package, so this
# workflow checks out and builds its source directly; replace the
# "Install PrimeTime" step with a plain package install once it is.

on:
  schedule:
    # Runs every 15 minutes, all day, every day — actual timing is decided
    # by the "Check whether a primer is due" step below, which is
    # timezone/DST-aware (see `primetime schedule due`). A fixed daytime UTC
    # band can't safely cover every IANA offset, so this cadence
    # intentionally doesn't try to narrow the window itself.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  # Required so this job can request a GitHub Actions OIDC token proving
  # "I am run X of workflow Y in repo Z" to the PrimeTime backend below.
  id-token: write

concurrency:
  group: primetime-codex-primer-hosted
  cancel-in-progress: false

env:
  # PLACEHOLDER — replace with your PrimeTime deployment's own URL once one
  # exists. Must match the OIDC_AUDIENCE the backend was configured with.
  PRIMETIME_WEB_URL: https://primetime.example.invalid
  OIDC_AUDIENCE: https://primetime.example.invalid

jobs:
  prime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        # No `repository`/`path` override — this checks out the repo the
        # workflow lives in, giving the due-check step below access to
        # .primetime/schedule.json. Distinct from "Check out PrimeTime"
        # below, which checks out PrimeTime's own source into primetime/.

      - name: Check out PrimeTime
        uses: actions/checkout@v4
        with:
          repository: RamiSmat/primetime
          ref: main
          path: primetime

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PrimeTime
        working-directory: primetime
        run: |
          npm ci
          npm run build

      - name: Check whether a primer is due
        id: due-check
        # A missing .primetime/schedule.json is a real error (exit 1, not
        # "always due" or "never due") — it means setup didn't finish, and
        # that should surface loudly rather than silently misbehave.
        #
        # --tolerance-minutes 20 (wider than the CLI's own 8-minute default)
        # gives GitHub's best-effort `schedule` trigger more room to still
        # catch a primer instant even when a tick lands late — GitHub's own
        # docs warn that scheduled runs can be delayed under load, and that
        # is most pronounced right at cron's round marks (:00/:15/:30/:45),
        # which this cadence uses.
        run: |
          set +e
          node primetime/apps/cli/dist/src/bin.js schedule due .primetime/schedule.json --tolerance-minutes 20
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then
            echo "due=false" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Install the official Codex CLI
        if: steps.due-check.outputs.due == 'true'
        run: npm install -g @openai/codex

      - name: Restore the Codex session
        id: restore
        if: steps.due-check.outputs.due == 'true'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "::error::CODEX_AUTH_JSON is not set. Run 'primetime setup codex' locally first." >&2
            exit 1
          fi
          mkdir -p "$HOME/.codex"
          printf '%s' "$CODEX_AUTH_JSON" > "$HOME/.codex/auth.json"
          chmod 600 "$HOME/.codex/auth.json"

      - name: Run the Codex primer
        if: steps.due-check.outputs.due == 'true'
        run: node primetime/apps/cli/dist/src/bin.js prime codex

      - name: Persist the refreshed Codex session
        # Runs even if the primer step above failed, so a refresh that
        # happened before the failure is not lost — but only if a primer was
        # actually due this run and the session was actually restored.
        if: always() && steps.due-check.outputs.due == 'true' && steps.restore.outcome == 'success'
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          # Exchange this run's GitHub Actions OIDC identity for a
          # short-lived, repository-scoped installation token. The Codex
          # session above never passes through this exchange or through
          # PrimeTime's backend at all — only this one-time write-back
          # token does, and it can do nothing but manage this repository's
          # secrets for the next hour.
          oidc_request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}"
          oidc_token=$(curl -sf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_request_url" | jq -r '.value')

          if [ -z "$oidc_token" ] || [ "$oidc_token" = "null" ]; then
            echo "::warning::Could not obtain a GitHub Actions OIDC token, so the refreshed Codex session could not be saved. Future runs may need to re-authenticate sooner than expected." >&2
            exit 0
          fi

          install_token=$(curl -sf -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Content-Type: application/json" \
            "${PRIMETIME_WEB_URL}/api/actions/token" | jq -r '.token')

          if [ -z "$install_token" ] || [ "$install_token" = "null" ]; then
            echo "::warning::PrimeTime backend did not return an installation token, so the refreshed Codex session could not be saved. Confirm the PrimeTime GitHub App is installed on this repository." >&2
            exit 0
          fi

          GH_TOKEN="$install_token" node primetime/apps/cli/dist/src/bin.js setup codex
