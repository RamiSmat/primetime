name: PrimeTime Claude Code primer

# Copy this file into .github/workflows/ in your own PrimeTime-controlled
# repository. Before it will work you must, from a local checkout of THIS
# repository (not the one this workflow lives in):
#
#   1. `claude setup-token` (never an API key) — it opens a browser to
#      authorize, then prints a one-year long-lived CLAUDE_CODE_OAUTH_TOKEN
#      once. Copy it.
#   2. `echo "$THE_TOKEN" | primetime setup claude-code` to store that token
#      as this repo's CLAUDE_CODE_OAUTH_TOKEN secret.
#
# Unlike codex-prime.yml, that's the whole setup: Claude Code's token is
# long-lived and this workflow never modifies it, so there's no second
# secret and no write-back step needed to keep it alive. See the root
# README's "GitHub Actions credential setup" section under "Claude Code
# provider" for why.
#
# PrimeTime is not yet published as an installable package, so this
# workflow checks out and builds its source directly; replace the
# "Install PrimeTime" step with a plain package install once it is.

on:
  schedule:
    # Runs every 15 minutes, all day, every day — actual timing is decided
    # by the "Check whether a primer is due" step below, which is
    # timezone/DST-aware (see `primetime schedule due`). A fixed daytime UTC
    # band can't safely cover every IANA offset, so this cadence
    # intentionally doesn't try to narrow the window itself. Offset by 7
    # minutes off the round marks (:00/:15/:30/:45) rather than "*/15",
    # since GitHub's own docs warn that scheduled runs are most likely to
    # be delayed right at those marks (see templates/github-actions/README.md).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  # "write" (not "read") so the "Persist primer state" step below can commit
  # .primetime/state-claude-code.json back to this repo with the default
  # GITHUB_TOKEN — no extra secret needed, since that file holds only a
  # timestamp, never credentials.
  contents: write

concurrency:
  group: primetime-claude-code-primer
  cancel-in-progress: false

jobs:
  prime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        # No `repository`/`path` override — this checks out the repo the
        # workflow lives in, giving the due-check step below access to
        # .primetime/schedule.json. Distinct from "Check out PrimeTime"
        # below, which checks out PrimeTime's own source into primetime/.

      - name: Check out PrimeTime
        uses: actions/checkout@v4
        with:
          repository: RamiSmat/primetime
          ref: main
          path: primetime

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PrimeTime
        working-directory: primetime
        run: |
          npm ci
          npm run build

      - name: Read last-primed state
        id: last-primed
        # .primetime/state-claude-code.json (written by "Persist primer
        # state" below) records when Claude Code was last actually primed.
        # Feeding that into the due-check step lets it catch up on an
        # instant that a late or dropped GitHub schedule tick already
        # missed, rather than silently losing that day's primer.
        # Missing/unreadable is treated as "never primed", the same as a
        # first-ever run.
        run: |
          if [ -f .primetime/state-claude-code.json ]; then
            value=$(jq -r '.lastPrimedAt // empty' .primetime/state-claude-code.json)
          else
            value=""
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Check whether a primer is due
        id: due-check
        # A missing .primetime/schedule.json is a real error (exit 1, not
        # "always due" or "never due") — it means setup didn't finish, and
        # that should surface loudly rather than silently misbehave.
        #
        # --tolerance-minutes 20 (wider than the CLI's own 8-minute default)
        # absorbs ordinary lateness; --last-primed-at (see the step above)
        # additionally catches up on a tick GitHub dropped outright, since
        # no fixed tolerance can absorb an outage of unpredictable length.
        env:
          LAST_PRIMED_AT: ${{ steps.last-primed.outputs.value }}
        run: |
          set +e
          if [ -n "$LAST_PRIMED_AT" ]; then
            node primetime/apps/cli/dist/src/bin.js schedule due .primetime/schedule.json claude-code --tolerance-minutes 20 --last-primed-at "$LAST_PRIMED_AT"
          else
            node primetime/apps/cli/dist/src/bin.js schedule due .primetime/schedule.json claude-code --tolerance-minutes 20
          fi
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then
            echo "due=false" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Install the official Claude Code CLI
        if: steps.due-check.outputs.due == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the Claude Code primer
        id: run-primer
        if: steps.due-check.outputs.due == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Run 'claude setup-token' locally, then 'primetime setup claude-code', first." >&2
            exit 1
          fi
          node primetime/apps/cli/dist/src/bin.js prime claude-code

      - name: Persist primer state
        if: steps.due-check.outputs.due == 'true' && steps.run-primer.outcome == 'success'
        # Records when Claude Code was actually primed, feeding the "Read
        # last-primed state" catch-up check above. Best-effort: a lost race
        # against a concurrent push (e.g. from the Codex primer workflow's
        # own, separate state file) just means a slightly higher chance of
        # re-priming on the next tick, never a hard failure.
        run: |
          mkdir -p .primetime
          printf '{"lastPrimedAt":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .primetime/state-claude-code.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .primetime/state-claude-code.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record last successful Claude Code primer run"
          git fetch origin "$GITHUB_REF_NAME"
          if ! git rebase "origin/$GITHUB_REF_NAME"; then
            git rebase --abort
            echo "::warning::Could not rebase onto the latest $GITHUB_REF_NAME before recording the Claude Code primer state; skipping this update." >&2
            exit 0
          fi
          if ! git push origin "HEAD:$GITHUB_REF_NAME"; then
            echo "::warning::Could not push the updated Claude Code primer state (a concurrent update may have won the race); a future run will retry." >&2
          fi
